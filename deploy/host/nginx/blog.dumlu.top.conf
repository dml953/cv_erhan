# Blog technique — https://blog.dumlu.top  →  ct-blog (10.0.3.12), Dotclear

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.dumlu.top;

    ssl_certificate     /etc/letsencrypt/live/blog.dumlu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.dumlu.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/blog.dumlu.top.access.log;
    error_log  /var/log/nginx/blog.dumlu.top.error.log;

    include snippets/en-tetes-securite.conf;

    # Les billets comportent des captures d'écran : laisser de la marge.
    client_max_body_size 64m;

    location / {
        include snippets/proxy-commun.conf;
        proxy_pass http://10.0.3.12;
    }
}
