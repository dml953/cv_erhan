# En-têtes de sécurité renvoyés au navigateur.
# `always` les applique aussi aux réponses d'erreur (4xx/5xx).

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# HSTS : le navigateur refusera le http:// pendant un an.
# includeSubDomains est volontairement absent : il casserait tout
# sous-domaine qui n'aurait pas encore son certificat.
add_header Strict-Transport-Security "max-age=31536000" always;
