# Brasserie T&S — https://brasserie.dumlu.top  →  ct-brasserie (10.0.3.13), WordPress
#
# Ce fichier n'est activé qu'une fois le conteneur en place et le certificat
# obtenu (étape « migration WordPress », non traitée pour l'instant).

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brasserie.dumlu.top;

    ssl_certificate     /etc/letsencrypt/live/brasserie.dumlu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brasserie.dumlu.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/brasserie.dumlu.top.access.log;
    error_log  /var/log/nginx/brasserie.dumlu.top.error.log;

    include snippets/en-tetes-securite.conf;
    client_max_body_size 64m;

    location / {
        include snippets/proxy-commun.conf;
        proxy_pass http://10.0.3.13;
    }
}
