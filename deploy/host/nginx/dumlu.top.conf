# Vitrine — https://dumlu.top  →  ct-portfolio (10.0.3.11)

# www redirigé vers le domaine nu, pour ne pas dupliquer le contenu.
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dumlu.top;

    ssl_certificate     /etc/letsencrypt/live/dumlu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dumlu.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dumlu.top$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dumlu.top;

    ssl_certificate     /etc/letsencrypt/live/dumlu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dumlu.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/dumlu.top.access.log;
    error_log  /var/log/nginx/dumlu.top.error.log;

    include snippets/en-tetes-securite.conf;

    # Le site est statique : pas d'envoi de fichier, une petite limite suffit
    # et réduit la surface d'abus du formulaire de contact.
    client_max_body_size 1m;

    location / {
        include snippets/proxy-commun.conf;
        proxy_pass http://10.0.3.11;
    }
}
