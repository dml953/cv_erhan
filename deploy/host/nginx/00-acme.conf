# Serveur par défaut sur le port 80.
#
# Deux rôles :
#  - répondre aux validations ACME de Let's Encrypt ;
#  - renvoyer tout le reste en HTTPS.
#
# Ce fichier est le seul à écouter en clair : chaque site n'a qu'un bloc 443.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
