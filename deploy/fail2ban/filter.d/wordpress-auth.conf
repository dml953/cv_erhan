# Échecs d'authentification WordPress (brasserie.dumlu.top).
#
# Même principe que dotclear-auth : un POST vers wp-login.php répondant 200
# correspond au formulaire réaffiché après échec, une connexion réussie
# répondant 302. xmlrpc.php est également surveillé : c'est le point d'entrée
# habituel des attaques par force brute sur WordPress, car il permet
# d'essayer de nombreux couples identifiant/mot de passe par requête.

[Definition]

failregex = ^<HOST> .* "POST /wp-login\.php[^"]*" 200 
            ^<HOST> .* "POST /xmlrpc\.php[^"]*" (?:200|40[03]) 

ignoreregex =
