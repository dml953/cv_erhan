# Échecs d'authentification sur l'administration Dotclear.
#
# Dotclear ne journalise pas les échecs dans un fichier dédié : on s'appuie
# sur les journaux Apache du conteneur. Un POST vers le formulaire de
# connexion répondant 200 signifie que le formulaire a été réaffiché, donc
# que la connexion a échoué ; une connexion réussie répond 302.
#
# Le format attendu est « proxy_combined », défini par web-base.sh : il place
# en tête l'adresse réelle du visiteur rétablie par mod_remoteip, et non celle
# du reverse proxy. <HOST> est ancré en début de ligne : une chaîne forgée
# dans le User-Agent ne peut donc pas faire bannir l'adresse d'un tiers.
#
# Le motif évite volontairement de décrire le champ date : fail2ban le retire
# de la ligne avant d'appliquer le motif, en laissant des crochets vides.
#
# À REVÉRIFIER une fois Dotclear installé, le chemin de connexion ayant
# changé selon les versions :
#   fail2ban-regex /var/lib/lxc/ct-blog/rootfs/var/log/apache2/blog.dumlu.top.access.log \
#                  /etc/fail2ban/filter.d/dotclear-auth.conf

[Definition]

failregex = ^<HOST> .* "POST /admin/(?:auth\.php|auth|login)\b[^"]*" 200 

ignoreregex =
